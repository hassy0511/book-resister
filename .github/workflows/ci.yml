# CI: 型チェック・単体テスト・ビルド・Firestore セキュリティルールのテスト
# （main へのデプロイ（deploy.yml）も、デプロイの前に同じテストを自分のジョブの中で行い、失敗したらデプロイしない）
name: CI

# push は main だけ（PR のブランチで push と pull_request の 2 回走らないようにして、無料枠の時間を節約する）
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# 同じブランチで新しい push があれば、古い実行は取り消す
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Firestore エミュレータ（npm run test:rules）に Java が必要
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: 依存パッケージのインストール
        run: npm ci --no-audit --no-fund

      - name: 型チェック
        run: npm run typecheck

      - name: 単体テスト
        run: npm test

      - name: ビルド
        run: npm run build
        env:
          # CI ではビルドが通るかだけを確かめるのでダミー値
          VITE_FIREBASE_API_KEY: dummy-api-key
          VITE_FIREBASE_AUTH_DOMAIN: demo-book-resister.web.app
          VITE_FIREBASE_PROJECT_ID: demo-book-resister
          VITE_FIREBASE_APP_ID: '1:000000000000:web:0000000000000000'
          VITE_FIREBASE_MESSAGING_SENDER_ID: '000000000000'
          VITE_VAPID_PUBLIC_KEY: dummy-vapid-public-key
          VITE_GOOGLE_BOOKS_API_KEY: ''

      # エミュレータの jar を毎回ダウンロードしないようにキャッシュする
      - name: Firebase エミュレータのキャッシュ
        uses: actions/cache@v4
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: firebase-emulators-${{ runner.os }}-

      - name: セキュリティルールのテスト
        run: npm run test:rules
