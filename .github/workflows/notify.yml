# 返却日の通知（F-100〜F-104）
# 毎朝、家族のグループ（NOTIFY_GROUP_IDS）の貸出中の本を調べて、延滞・明日返却・3日後に返却の本があれば Web Push を送る。
#
# 必要な設定（docs/setup.md）:
#   app.config.json: vapidPublicKey, notifyGroupIds（通知するグループの ID。空なら全グループを処理して警告を出す）,
#                    vapidSubject（任意。空ならアプリの URL を使う）。Firebase のプロジェクト ID からアプリの URL を決める
#   Secrets: NOTIFY_SERVICE_ACCOUNT（通知専用のサービスアカウント notify-bot の JSON をそのまま。
#              Cloud Datastore ユーザーのロールだけを持つ。デプロイ用の FIREBASE_SERVICE_ACCOUNT は渡さない）,
#            VAPID_PRIVATE_KEY
#   Variables は不要（同じ名前の Variables があれば app.config.json より優先する）
# NOTIFY_SERVICE_ACCOUNT が未登録のときは、デプロイ用の鍵には切り替えず、エラーで止める。
name: 返却日の通知

on:
  schedule:
    # UTC 22:45 = 日本時間 7:45。実行の遅れを見込んで「8 時ごろ」に届く想定
    - cron: '45 22 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: '送信せずに内容だけ表示する'
        type: boolean
        default: false

permissions:
  contents: read

# 手動実行と定期実行が重なっても二重に送らない
concurrency:
  group: notify
  cancel-in-progress: false

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 依存パッケージのインストール
        run: npm ci --no-audit --no-fund

      # app.config.json の設定を読み込む（同じ名前の Variables があればそちらを優先）
      - name: 設定の読み込み
        env:
          NOTIFY_GROUP_IDS: ${{ vars.NOTIFY_GROUP_IDS }}
          VAPID_PUBLIC_KEY: ${{ vars.VAPID_PUBLIC_KEY }}
          VAPID_SUBJECT: ${{ vars.VAPID_SUBJECT }}
          APP_URL: ${{ vars.APP_URL }}
        run: npx tsx scripts/appConfig.ts

      - name: 通知を送信
        env:
          # スクリプトが読む環境変数の名前は FIREBASE_SERVICE_ACCOUNT のまま（中身は通知専用の鍵）
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.NOTIFY_SERVICE_ACCOUNT }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          # 定期実行では inputs が空なので false になる
          DRY_RUN: ${{ inputs.dry_run && 'true' || 'false' }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "::error::Secrets の NOTIFY_SERVICE_ACCOUNT が未登録です。docs/setup.md 手順 5・6 の通知専用の鍵（notify-bot）を登録してください（デプロイ用の鍵は使いません）。"
            exit 1
          fi
          if [ "$DRY_RUN" = "true" ]; then
            npx tsx scripts/notify/index.ts --dry-run
          else
            npx tsx scripts/notify/index.ts
          fi
